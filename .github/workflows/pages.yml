# Превью сайта на GitHub Pages при каждом пуше в main.
# Включить: Settings → Pages → Source: GitHub Actions.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Подготовить публичные файлы и метку версии
        run: python3 scripts/build-preview.py
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          PREVIEW_INDEX: ${{ vars.PREVIEW_INDEX }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .publish
      - id: deployment
        uses: actions/deploy-pages@v4
